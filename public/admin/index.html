<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="referrer" content="no-referrer" />
  <title>Pedidos | Lentes Pura Vida</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/admin/board.css" />
  <script src="/admin/board.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="top-row">
      <a class="brand" href="/admin/" aria-label="Pedidos">
        <img src="/logo.svg" alt="Lentes Pura Vida" width="150" height="40" />
        <span class="brand-tag">Pedidos</span>
      </a>
      <button type="button" class="icon-btn" data-refresh aria-label="Actualizar" title="Actualizar">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="tools">
      <label class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="search" data-search placeholder="Buscar nombre, teléfono o código" autocomplete="off" aria-label="Buscar" />
      </label>
      <select data-filter aria-label="Etapa">
        <option value="">Todas las etapas</option>
      </select>
    </div>
    <nav class="tabs" data-tabs aria-label="Etapas"></nav>
  </header>

  <main class="board" data-board aria-live="polite">
    <p class="loading">Cargando pedidos…</p>
  </main>

  <div class="toast" data-toast role="status" popover="manual" hidden></div>

  <dialog class="sheet" data-detail aria-labelledby="d-title"></dialog>
  <dialog class="mover" data-mover aria-label="Mover a otra etapa"></dialog>
</body>
</html>
