# Cloudflare Pages config for lentespuravida (order board, branch orders-board).
# Static site = dist/. Pages Functions in functions/ (POST /api/order, /admin, /api/admin/*).
# Secrets (TURNSTILE_SECRET) are set in the dashboard or with `wrangler pages secret put`,
# never here. Local dev values live in .dev.vars (gitignored). See SETUP in the order-board notes.
name = "lentespuravida"
pages_build_output_dir = "dist"
compatibility_date = "2026-07-01"

[vars]
# Cloudflare Access (Zero Trust), application "Pedidos".
# Empty = every admin request is refused (deny by default).
ACCESS_TEAM_DOMAIN = "arquillasolutions.cloudflareaccess.com"
ACCESS_AUD = "e54d5df3e726ebbf0d62912cf7a6f75c10877318ac8651940016ae0b0fb7e217"
# Comma-separated list of emails allowed on the board, checked again inside the code.
ADMIN_EMAILS = "sebastian@arquillasolutions.com"

[[d1_databases]]
binding = "DB"
database_name = "lentes_orders"
database_id = "020170d5-21f5-4396-bedd-531c2c838035"
migrations_dir = "migrations"
